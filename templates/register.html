<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TOEFL Vocab</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-card" style="max-width: 440px;">
        <h1>📘 TOEFL Vocab</h1>
        <div class="subtitle">Create a new account</div>
        {% if error %}
            <div class="error-box" style="background:#fde8e8; padding:12px; border-radius:12px; color:#a13d3d; margin-bottom:16px;">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Choose a username</label>
                <input type="text" name="username" class="form-input" placeholder="Username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Create Account</button>
        </form>
        <p style="margin-top:20px; text-align:center; color:#4a5b7a;">
            Already have an account? <a href="/login" style="color:#1f3a6b; font-weight:600;">Sign In</a>
        </p>
    </div>
</body>
</html>
